name: Deploy Static Website to S3

# Triggers the workflow on pushes to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Do not leave the GITHUB_TOKEN in .git/config. It is written there as
          # an AUTHORIZATION extraheader, and .git must never reach the bucket.
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Two passes because `aws s3 sync` applies one --cache-control to every
      # object it copies, so HTML and binary assets need separate policies.
      #
      # CloudFront uses the Managed-CachingOptimized policy (DefaultTTL 86400).
      # With no origin Cache-Control headers every object inherited that full
      # 24 hour TTL, which is why deploys were not visible for ~24 hours.
      #
      # Filter order matters: aws s3 sync applies the LAST matching rule, and an
      # --include on its own does not restrict anything because every file also
      # matches the implicit include-all. Each pass therefore starts with
      # --exclude "*" and then re-includes only the files that pass owns.
      - name: Deploy static assets (images, documents) - long cache
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }}/ --delete \
            --exclude "*" \
            --include "*.jpg" --include "*.jpeg" --include "*.png" \
            --include "*.gif" --include "*.webp" --include "*.svg" \
            --include "*.ico" --include "*.pdf" --include "*.docx" \
            --include "*.doc" --include "*.mp4" --include "*.webm" \
            --cache-control "public,max-age=2592000,immutable"

      - name: Deploy HTML - short cache so updates appear quickly
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public,max-age=300,must-revalidate"

      - name: Deploy public text/XML files - short cache
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "robots.txt" \
            --include "sitemap.xml" \
            --cache-control "public,max-age=300,must-revalidate"

      # `aws s3 sync --delete` does not remove destination files that are
      # excluded by a filter, so anything published by earlier runs has to be
      # deleted explicitly.
      - name: Remove files that must never be published
        run: |
          aws s3 rm s3://${{ secrets.S3_BUCKET_NAME }}/.git --recursive || true
          aws s3 rm s3://${{ secrets.S3_BUCKET_NAME }}/.github --recursive || true

      - name: Verify sensitive paths were removed
        run: |
          failed=0
          for key in .git/config .git/HEAD .github/workflows/deploy.yml; do
            if aws s3api head-object \
                 --bucket "${{ secrets.S3_BUCKET_NAME }}" \
                 --key "$key" >/dev/null 2>&1; then
              echo "ERROR: $key still exists in the bucket"
              failed=1
            else
              echo "OK: $key is not in the bucket"
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: Output S3 Website URL
        run: |
          echo "Website is live at: http://${{ secrets.S3_BUCKET_NAME }}.s3-website.${{ secrets.AWS_REGION }}.amazonaws.com"
